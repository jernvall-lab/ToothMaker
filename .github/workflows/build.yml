name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux-x64
            artifact: ToothMaker-Linux-x64
          - os: ubuntu-22.04-arm
            name: Linux-ARM
            artifact: ToothMaker-Linux-ARM
          - os: macos-15-intel
            name: macOS-Intel
            artifact: ToothMaker-macOS-Intel
          - os: macos-14
            name: macOS-ARM
            artifact: ToothMaker-macOS-ARM
          - os: windows-2022
            name: Windows
            artifact: ToothMaker-Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for git rev-list version

      - name: Get version
        id: version
        shell: bash
        run: |
          # Extract version from morphomaker.h (e.g., "0.8.0dev")
          VERSION=$(grep '#define MMAKER_VERSION' common/morphomaker.h | head -1 | sed 's/.*"\(.*\)".*/\1/')
          # Remove dots for folder name (e.g., "080dev")
          VERSION_NODOTS=$(echo "$VERSION" | tr -d '.')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NODOTS=$VERSION_NODOTS" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION -> $VERSION_NODOTS"

      #
      # Install Qt and build dependencies
      #
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev \
            gfortran clang libgl1-mesa-dev libx11-dev

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          # Homebrew's "qt" formula is Qt 6. All three platforms build with
          # Qt 6 (Linux: Ubuntu 22.04's apt Qt 6.2).
          brew install qt
          echo "$(brew --prefix qt)/bin" >> $GITHUB_PATH

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6 to match local dev (Qt 6.10.3 on the Windows VM) and to get
          # automatic high-DPI scaling.
          version: '6.10.3'
          cache: true

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          # Homebrew gcc installs gfortran with version suffix (e.g., gfortran-14)
          # Create symlink so 'gfortran' command works
          GFORTRAN=$(ls $(brew --prefix)/bin/gfortran-* 2>/dev/null | head -1)
          if [ -n "$GFORTRAN" ]; then
            sudo ln -sf "$GFORTRAN" /usr/local/bin/gfortran
          fi

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-clang
            make

      #
      # Build tribosphenic models (separate step for clarity)
      #
      - name: Build tribosphenic models (Unix)
        if: runner.os != 'Windows'
        working-directory: models/tribosphenic
        run: make

      - name: Build tribosphenic models (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: models/tribosphenic
        run: make

      - name: Build triconodont model (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: models/triconodont
        run: make

      #
      # Run model tests
      #
      - name: Run tribosphenic tests (Unix)
        if: runner.os != 'Windows'
        working-directory: models/tribosphenic
        run: make test

      #
      # Build Qt application
      #
      - name: Build ToothMaker (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir build && cd build
          QMAKE=$(command -v qmake6 || command -v qmake)   # apt Qt 6 installs qmake6
          "$QMAKE" ../ToothMaker.pro CONFIG+=release
          make

      - name: Build ToothMaker (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # MSVC environment through vswhere + vcvars64.bat (ilammy/msvc-dev-cmd
        # has no Node 24 release; Node 20 was removed from runners 2026-09-23).
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo vswhere found no Visual Studio with the C++ tools & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          mkdir build
          cd build
          qmake ..\ToothMaker.pro CONFIG+=release
          nmake

      #
      # Copy resources
      #
      - name: Copy resources (Unix)
        if: runner.os != 'Windows'
        working-directory: build
        run: ../copy_resources.sh

      - name: Copy resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Resources/ must sit next to ToothMaker.exe (RESOURCES macro = "Resources/")
          $resourceDir = "build/interface/release/Resources"
          New-Item -ItemType Directory -Force -Path "$resourceDir/bin"

          # Copy interface resources
          Copy-Item interface/data/images/* $resourceDir/
          Copy-Item interface/src/renderer/*.glsl $resourceDir/

          # Copy model data
          Get-ChildItem models/*/data -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item "$($_.FullName)/*" $resourceDir/
          }

          # Copy model binaries (.exe only — skip any MinGW DLLs since model
          # binaries are now statically linked).
          Get-ChildItem models/*/bin -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item "$($_.FullName)/*.exe" "$resourceDir/bin/" -ErrorAction SilentlyContinue
          }

          # Copy utility binaries. MSVC qmake puts release builds under
          # build/models/utils/<name>/release/, not build/models/utils/<name>/.
          Get-ChildItem build/models/utils/*/release/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "$resourceDir/bin/"
          }

      #
      # Run CLI scanning tests
      # Note: macOS CI runners lack GPU, so CGL offscreen context fails.
      # Triconodont (Fortran) tests are skipped on x86_64 due to FP differences.
      #
      - name: Run CLI tests (Linux ARM)
        if: matrix.name == 'Linux-ARM'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run examples/cli/run_tests.sh build/interface/ToothMaker

      - name: Run CLI tests (Linux x64)
        if: matrix.name == 'Linux-x64'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run examples/cli/run_tests.sh --skip-triconodont build/interface/ToothMaker

      #
      # Package artifacts
      #
      # Stage final package directory per platform. Linux and Windows upload the
      # directory as is; upload-artifact zips it on download. macOS uploads a
      # ditto zip instead (see below), accepting a double-wrapped download.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          PACKAGE_DIR="ToothMaker_${{ steps.version.outputs.VERSION_NODOTS }}"
          mkdir -p "$PACKAGE_DIR"
          cp -r build/interface/ToothMaker "$PACKAGE_DIR/"
          cp -r build/interface/Resources "$PACKAGE_DIR/"
          cp scripts/linux/*.sh "$PACKAGE_DIR/"

          # Remove macOS-specific library
          rm -f "$PACKAGE_DIR/Resources/bin/libquadmath.0.dylib"

      # Self-contained AppImage (Qt and libquadmath bundled; glibc, libstdc++, X11
      # and OpenGL come from the user's system). Resources sit next to the
      # executable, where ToothMaker looks for them.
      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1   # the runner has no FUSE for the tools
          LINUXDEPLOY_OUTPUT_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ARCH=$(uname -m)
          export QMAKE=$(command -v qmake6)   # tells the qt plugin which Qt to bundle
          curl -sSL -o "linuxdeploy-$ARCH.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$ARCH.AppImage"
          curl -sSL -o "linuxdeploy-plugin-qt-$ARCH.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$ARCH.AppImage"
          chmod +x linuxdeploy-*.AppImage

          mkdir -p AppDir/usr/bin
          cp -r build/interface/Resources AppDir/usr/bin/Resources
          rm -f AppDir/usr/bin/Resources/bin/libquadmath.0.dylib
          DEPS=""
          for f in AppDir/usr/bin/Resources/bin/*; do DEPS="$DEPS --deploy-deps-only $f"; done

          "./linuxdeploy-$ARCH.AppImage" --appdir AppDir \
            --executable build/interface/ToothMaker \
            --desktop-file scripts/linux/toothmaker.desktop \
            --icon-file interface/icons/toothmaker.png \
            --custom-apprun scripts/linux/AppRun \
            --plugin qt $DEPS --output appimage
          mkdir -p appimage && mv ToothMaker-*.AppImage appimage/
          ls -la appimage/

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Run macdeployqt to bundle Qt frameworks
          macdeployqt build/interface/ToothMaker.app

          # Ad-hoc sign the app (required for Apple Silicon)
          codesign --force --deep -s - build/interface/ToothMaker.app

          # Create versioned directory and move app into it
          PACKAGE_DIR="ToothMaker_${{ steps.version.outputs.VERSION_NODOTS }}"
          mkdir -p "$PACKAGE_DIR"
          mv build/interface/ToothMaker.app "$PACKAGE_DIR/"

          # Zip with ditto so the Qt framework symlinks survive: upload-artifact
          # replaces symlinks with copies, and codesign rejects such frameworks
          # ("bundle format is ambiguous"). --norsrc: no AppleDouble ._ entries, which
          # unzip would materialise and codesign also rejects. The zip is named after
          # the artifact because scripts/sign_macos_releases.sh looks for that inner zip.
          ditto -c -k --norsrc --keepParent "$PACKAGE_DIR" "${{ matrix.artifact }}.zip"
          rm -rf "$PACKAGE_DIR"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Stage Qt DLLs alongside the exe.
          windeployqt --release --no-translations build/interface/release/ToothMaker.exe

          # Package only deployment artifacts — the exe, the DLLs windeployqt
          # placed next to it, and the subdirectories windeployqt created
          # (platforms/, imageformats/, styles/, ...). MSVC build intermediates
          # (.obj, moc_*.cpp, object_script.*, .res) sit flat in release/ and
          # are skipped.
          $packageDir = "ToothMaker_${{ steps.version.outputs.VERSION_NODOTS }}"
          $buildOut = "build/interface/release"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "$buildOut/ToothMaker.exe" $packageDir/
          Copy-Item "$buildOut/*.dll" $packageDir/ -ErrorAction SilentlyContinue
          # Picks up windeployqt subdirs (platforms/, imageformats/, ...) and Resources/
          Get-ChildItem $buildOut -Directory | ForEach-Object {
              Copy-Item $_.FullName $packageDir/ -Recurse
          }

      #
      # Upload artifacts — the package directory on Linux and Windows, the ditto
      # zip on macOS (see Package (macOS)).
      #
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'macOS' && format('{0}.zip', matrix.artifact) || format('ToothMaker_{0}', steps.version.outputs.VERSION_NODOTS) }}

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-AppImage
          path: appimage/*.AppImage
